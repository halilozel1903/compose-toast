<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="compose-toast: toasts and snackbars for Jetpack Compose" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15123a"/>
      <stop offset="1" stop-color="#2b1f6b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f5fb"/>
      <stop offset="1" stop-color="#ece8f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-10%" y="-30%" width="120%" height="190%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1c1340" flood-opacity="0.18"/>
    </filter>
    <clipPath id="phone"><rect width="360" height="440" rx="32"/></clipPath>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <g font-family="'Google Sans', Roboto, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="190" fill="#ffffff" font-size="64" font-weight="800" letter-spacing="-2">compose-toast</text>
    <text x="82" y="244" fill="#d4ccff" font-size="27" font-weight="500">Toasts and snackbars for Jetpack Compose,</text>
    <text x="82" y="280" fill="#d4ccff" font-size="27" font-weight="500">done right: one line to show</text>
    <text x="82" y="342" fill="#b3a6ff" font-size="20" font-family="'JetBrains Mono', Menlo, monospace">toasts.success("Payment received")</text>
    <g font-size="18" font-weight="600" fill="#ece8ff">
      <rect x="82" y="378" width="96" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="130" y="403" text-anchor="middle">Queue</text>
      <rect x="190" y="378" width="96" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="238" y="403" text-anchor="middle">Swipe</text>
      <rect x="298" y="378" width="104" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="350" y="403" text-anchor="middle">Actions</text>
      <rect x="414" y="378" width="152" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="490" y="403" text-anchor="middle">Top or bottom</text>
      <rect x="578" y="378" width="116" height="38" rx="19" fill="#ffffff" fill-opacity="0.1"/>
      <text x="636" y="403" text-anchor="middle">TalkBack</text>
    </g>
    <g transform="translate(82 446)">
      <circle cx="11" cy="11" r="11" fill="#7dd99a"/>
      <circle cx="47" cy="11" r="11" fill="#ff8a80"/>
      <circle cx="83" cy="11" r="11" fill="#8ab4f8"/>
      <circle cx="119" cy="11" r="11" fill="#f6c35b"/>
      <text x="146" y="18" fill="#d4ccff" font-size="18" font-weight="500">success · error · info · warning · custom</text>
    </g>
    <text x="82" y="516" fill="#b3a6ff" font-size="18" font-weight="600" fill-opacity="0.85">Material 3 · Priorities and dedupe · Pause on touch · minSdk 24</text>

    <g transform="translate(840 60)" filter="url(#shadow)">
      <rect width="360" height="440" rx="32" fill="url(#screen)"/>
      <g clip-path="url(#phone)">
        <rect x="28" y="40" width="180" height="16" rx="8" fill="#d9d3ea"/>
        <rect x="28" y="70" width="280" height="10" rx="5" fill="#e4dff0"/>
        <rect x="28" y="90" width="230" height="10" rx="5" fill="#e4dff0"/>
        <rect x="28" y="124" width="140" height="40" rx="20" fill="#ffffff" stroke="#dcd8e6"/>
        <rect x="190" y="124" width="140" height="40" rx="20" fill="#ffffff" stroke="#dcd8e6"/>

        <g transform="translate(18 196)" filter="url(#soft)">
          <rect width="324" height="64" rx="16" fill="#ffffff"/>
          <circle cx="34" cy="32" r="18" fill="#1b7f3b" fill-opacity="0.12"/>
          <path transform="translate(23 21) scale(0.92)" d="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM10,17l-5,-5 1.41,-1.41L10,14.17l7.59,-7.59L19,8l-9,9z" fill="#1b7f3b"/>
          <text x="64" y="28" fill="#1c1b22" font-size="15" font-weight="700">Payment received</text>
          <text x="64" y="47" fill="#5f5b6b" font-size="13">€48.00 from Ada Lovelace</text>
        </g>
        <g transform="translate(18 270)" filter="url(#soft)">
          <rect width="324" height="64" rx="16" fill="#ffffff"/>
          <circle cx="34" cy="32" r="18" fill="#b3261e" fill-opacity="0.12"/>
          <path transform="translate(23 21) scale(0.92)" d="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM13,17h-2v-2h2v2zM13,13h-2L11,7h2v6z" fill="#b3261e"/>
          <text x="64" y="28" fill="#1c1b22" font-size="15" font-weight="700">Upload failed</text>
          <text x="64" y="47" fill="#5f5b6b" font-size="13">Check your connection.</text>
          <text x="302" y="37" fill="#b3261e" font-size="14" font-weight="700" text-anchor="end">Retry</text>
        </g>
        <g transform="translate(18 344)" filter="url(#soft)">
          <rect width="324" height="64" rx="16" fill="#ffffff"/>
          <circle cx="34" cy="32" r="18" fill="#1a63d6" fill-opacity="0.12"/>
          <path transform="translate(23 21) scale(0.92)" d="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM13,17h-2v-6h2v6zM13,9h-2L11,7h2v2z" fill="#1a63d6"/>
          <text x="64" y="37" fill="#1c1b22" font-size="14">Conversation archived</text>
          <text x="302" y="37" fill="#1a63d6" font-size="14" font-weight="700" text-anchor="end">Undo</text>
        </g>
      </g>
    </g>
  </g>
</svg>
